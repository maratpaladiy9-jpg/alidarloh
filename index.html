<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Простая машинка</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #87CEEB; /* Небо */
            overflow: hidden;
        }

        /* Дорога */
        .road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            background-color: #333;
        }

        /* Сама машинка (ширина 200px) */
        .car {
            position: absolute;
            bottom: 85px;
            width: 200px;
            height: 80px;
            animation: move 3s ease-out forwards;
        }

        /* Верх (крыша) */
        .top {
            width: 110px;
            height: 35px;
            background-color: #e74c3c;
            margin-left: 35px;
            border-radius: 15px 15px 0 0;
        }

        /* Низ (кузов) */
        .bottom {
            width: 200px;
            height: 35px;
            background-color: #c0392b;
            border-radius: 10px;
        }

        /* Колёса */
        .wheel {
            position: absolute;
            bottom: -5px;
            width: 34px;
            height: 34px;
            background-color: #111;
            border: 4px solid #bbb;
            border-radius: 50%;
            box-sizing: border-box;
        }

        .wheel-left { left: 25px; }
        .wheel-right { right: 25px; }

        /* Анимация выезда слева и остановки за 50px до правого края */
        @keyframes move {
            from {
                left: -200px;
            }
            to {
                left: calc(100vw - 250px);
            }
        }
    </style>
</head>
<body>

    <div class="road"></div>

    <div class="car">
        <div class="top"></div>
        <div class="bottom"></div>
        <div class="wheel wheel-left"></div>
        <div class="wheel wheel-right"></div>
    </div>

</body>
</html>
